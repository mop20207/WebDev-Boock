<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Formulario de contacto con validación de campos y mensajes accesibles."><title>Formulario con validación</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="panel"><span class="eyebrow">CONTACTO</span><h1>Hablemos de tu proyecto</h1><form id="form" novalidate><label for="name">Nombre</label><input id="name" name="name" minlength="2" required><small id="nameError"></small><label for="email">Correo electrónico</label><input id="email" name="email" type="email" required><small id="emailError"></small><label for="message">Mensaje</label><textarea id="message" name="message" minlength="10" required></textarea><small id="messageError"></small><button>Validar formulario</button></form><p id="result" role="status" aria-live="polite"></p></main><script src="app.js" defer></script></body></html>
