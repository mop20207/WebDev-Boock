<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Reloj local, cronómetro y cuenta regresiva configurable."><title>Reloj y temporizador</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="clock"><span class="eyebrow">HERRAMIENTAS DE TIEMPO</span><h1>Tu tiempo</h1><section><p>Hora local</p><output id="time">--:--:--</output><small id="date"></small></section><section><h2>Cronómetro</h2><output id="watch">00:00.0</output><button id="start">Iniciar</button><button id="stop">Pausar</button><button id="reset">Reiniciar</button></section><section><h2>Cuenta regresiva</h2><label for="seconds">Segundos</label><input id="seconds" type="number" min="1" max="3600" value="30"><output id="countdown">00:30</output><button id="countStart">Comenzar</button><p id="notice" role="status"></p></section></main><script src="app.js" defer></script></body></html>
