<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Dashboard con métricas calculadas y tabla filtrable de usuarios ficticios."><title>Panel de administración</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="admin"><header><span class="eyebrow">CONTROL CENTER</span><h1>Panel de administración</h1><p>Resumen y administración de usuarios de ejemplo.</p></header><section class="stats"><article><span>Usuarios</span><strong id="total">0</strong></article><article><span>Activos</span><strong id="active">0</strong></article><article><span>Administradores</span><strong id="admins">0</strong></article></section><section class="table-panel"><div class="table-head"><h2>Usuarios</h2><input id="search" type="search" placeholder="Buscar usuario..."></div><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Estado</th><th>Rol</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="app.js" defer></script></body></html>
