<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Aplicación CRUD con creación, filtros, tareas completadas y persistencia local."><title>Lista de tareas</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="todo"><header><span class="eyebrow">ORGANIZÁ TU DÍA</span><h1>Mis tareas</h1><p>Agregá, completá y eliminá tareas.</p></header><form id="taskForm"><label class="sr-only" for="taskInput">Nueva tarea</label><input id="taskInput" maxlength="100" placeholder="¿Qué necesitás hacer?" required><button>Agregar</button></form><nav class="filters"><button type="button" data-filter="all" aria-pressed="true">Todas</button><button type="button" data-filter="active" aria-pressed="false">Pendientes</button><button type="button" data-filter="done" aria-pressed="false">Hechas</button></nav><ul id="taskList"></ul><footer><span id="summary" aria-live="polite"></span><button id="clearDone" type="button">Borrar completadas</button></footer></main><script src="app.js" defer></script></body></html>
