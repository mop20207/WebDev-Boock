<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculadora de cuatro operaciones con decimales y control de división por cero."><title>Calculadora básica</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="calculator"><header><span>WEBDEV LAB</span><h1>Calculadora</h1></header><output id="display" aria-live="polite">0</output><div class="keys"><button data-action="clear">AC</button><button data-action="sign">±</button><button data-action="percent">%</button><button data-op="/" class="op">÷</button><button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button data-op="*" class="op">×</button><button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button data-op="-" class="op">−</button><button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button data-op="+" class="op">+</button><button data-action="decimal">.</button><button data-digit="0" class="zero">0</button><button data-action="equals" class="equal">=</button></div><p id="message" role="status"></p></main><script src="app.js" defer></script></body></html>
