<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Directorio local con alta, búsqueda, cambio de rol y eliminación de perfiles de ejemplo."><title>Sistema de usuarios (demo)</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="users"><header><span class="eyebrow">DIRECTORIO LOCAL</span><h1>Sistema de usuarios</h1><p>Demostración de administración de perfiles. No es autenticación real.</p></header><form id="form"><input id="name" placeholder="Nombre" required minlength="2"><input id="email" type="email" placeholder="Correo" required><select id="role"><option>Usuario</option><option>Editor</option><option>Administrador</option></select><button>Agregar</button></form><input id="search" type="search" placeholder="Buscar usuario..." aria-label="Buscar usuarios"><ul id="users"></ul><p id="status" role="status"></p></main><script src="app.js" defer></script></body></html>
