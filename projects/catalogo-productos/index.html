<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Catálogo con búsqueda, filtro por categoría, orden y carrito de prueba."><title>Catálogo de productos</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="store"><header><span class="eyebrow">TIENDA DE DEMOSTRACIÓN</span><h1>Catálogo</h1><p>Armá un carrito de prueba. No se cobra dinero.</p></header><div class="toolbar"><input id="search" type="search" placeholder="Buscar producto..." aria-label="Buscar"><select id="category" aria-label="Categoría"><option value="">Todas</option></select><select id="sort" aria-label="Ordenar"><option value="name">Nombre</option><option value="low">Menor precio</option><option value="high">Mayor precio</option></select></div><div class="layout"><section id="products" class="products"></section><aside class="cart"><h2>Carrito</h2><ul id="cartItems"></ul><strong id="total">$0</strong><p id="status" role="status"></p></aside></div></main><script src="app.js" defer></script></body></html>
