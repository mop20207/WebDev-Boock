<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Ciclo de una petición HTTP</title><desc id="desc">El cliente envía una petición, el servidor la procesa y devuelve una respuesta.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1425"/><stop offset="1" stop-color="#111f34"/></linearGradient></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><style>.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.3)}}@media(prefers-reduced-motion:reduce){.pulse{animation:none;opacity:1}}</style><circle class="pulse" cx="1080" cy="108" r="9" fill="#43d4b4"/><text x="75" y="72" fill="#75a8ff" font-size="16" font-weight="700" letter-spacing="3">WEBDEV BOOK · GUÍA VISUAL</text><text x="75" y="145" fill="#f4f7ff" font-size="38" font-weight="700">Ciclo de una petición HTTP</text><text x="75" y="190" fill="#a7b8d0" font-size="19">Viaje de una petición y su respuesta</text><rect x="74" y="230" width="1052" height="235" rx="25" fill="#0e1b2e" stroke="#263b56" stroke-width="2"/><rect x="80" y="270" width="220" height="155" rx="19" fill="#14233a" stroke="#304762" stroke-width="2"/><rect x="97" y="289" width="38" height="5" rx="3" fill="#6aa5ff"/><text x="98" y="333" fill="#6aa5ff" font-size="15" font-weight="700">01</text><text x="98" y="370" fill="#f4f7ff" font-size="21" font-weight="700">cliente</text><text x="98" y="398" fill="#9db0ca" font-size="14">concepto</text><path d="M 305 347 h 36 m -11 -9 11 9 -11 9" fill="none" stroke="#7592b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="350" y="270" width="220" height="155" rx="19" fill="#14233a" stroke="#304762" stroke-width="2"/><rect x="367" y="289" width="38" height="5" rx="3" fill="#43d4b4"/><text x="368" y="333" fill="#43d4b4" font-size="15" font-weight="700">02</text><text x="368" y="370" fill="#f4f7ff" font-size="21" font-weight="700">request</text><text x="368" y="398" fill="#9db0ca" font-size="14">estructura</text><path d="M 575 347 h 36 m -11 -9 11 9 -11 9" fill="none" stroke="#7592b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="620" y="270" width="220" height="155" rx="19" fill="#14233a" stroke="#304762" stroke-width="2"/><rect x="637" y="289" width="38" height="5" rx="3" fill="#f6b75c"/><text x="638" y="333" fill="#f6b75c" font-size="15" font-weight="700">03</text><text x="638" y="370" fill="#f4f7ff" font-size="21" font-weight="700">servidor</text><text x="638" y="398" fill="#9db0ca" font-size="14">flujo</text><path d="M 845 347 h 36 m -11 -9 11 9 -11 9" fill="none" stroke="#7592b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="890" y="270" width="220" height="155" rx="19" fill="#14233a" stroke="#304762" stroke-width="2"/><rect x="907" y="289" width="38" height="5" rx="3" fill="#b49aff"/><text x="908" y="333" fill="#b49aff" font-size="15" font-weight="700">04</text><text x="908" y="370" fill="#f4f7ff" font-size="21" font-weight="700">response</text><text x="908" y="398" fill="#9db0ca" font-size="14">resultado</text><rect x="74" y="495" width="1052" height="193" rx="24" fill="#14233a" stroke="#304762" stroke-width="2"/><text x="108" y="535" fill="#f3f7ff" font-size="21" font-weight="700">Puntos clave</text><circle cx="112" cy="548" r="5" fill="#6aa5ff"/><text x="132" y="555" fill="#c7d4e7" font-size="17">El método expresa la intención</text><circle cx="112" cy="591" r="5" fill="#43d4b4"/><text x="132" y="598" fill="#c7d4e7" font-size="17">El estado HTTP comunica el resultado</text><circle cx="112" cy="634" r="5" fill="#f6b75c"/><text x="132" y="641" fill="#c7d4e7" font-size="17">Fetch requiere comprobar response.ok</text><text x="75" y="727" fill="#6f849f" font-size="13" letter-spacing="2">RECURSO ORIGINAL · SVG ESCALABLE · WEBDEV BO