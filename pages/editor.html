<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18">
<title>Editor de código | WebDev Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/editor-app.css">
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script defer src="../js/editor-app.js"></script>
</head>
<body class="code-workbench">
<header class="workbench-top"><a class="workbench-brand" href="../index.html"><span>&lt;/&gt;</span> WebDev<span>Book</span></a><div class="workbench-project"><i></i><strong id="projectName">Mi proyecto</strong><small id="saveStatus">Guardado local</small></div><div class="workbench-actions"><button id="newFileBtn">＋ Archivo</button><button id="importBtn">↑ Importar</button><button id="downloadBtn" class="primary-action">↓ Descargar ZIP</button><a href="../index.html" class="exit-editor">Salir</a></div><input id="filePicker" type="file" multiple hidden></header>
<main class="workbench">
<aside class="file-sidebar"><div class="sidebar-title"><span>EXPLORADOR</span><div><button id="newFileSmall" title="Nuevo archivo">＋</button><button id="refreshFiles" title="Restablecer proyecto">↻</button></div></div><div id="fileTree" class="file-tree"></div><div class="sidebar-bottom-note">Tus archivos se guardan automáticamente en este dispositivo.</div></aside>
<section class="editor-column"><div class="editor-tabs" id="editorTabs"></div><div class="editor-toolbar"><span id="activeFileLabel">index.html</span><div><button id="formatBtn" title="Formato básico">⌘ Formatear</button><button id="closeTabBtn" title="Cerrar pestaña">×</button></div></div><div id="monacoEditor" aria-label="Editor de código"></div><div class="editor-status"><span id="languageStatus">HTML</span><span id="cursorStatus">Línea 1, columna 1</span><span>UTF-8</span><span>WebDev Editor</span></div></section>
<section class="preview-column"><div class="preview-toolbar"><div><b>VISTA PREVIA</b><span id="previewState">Actualización automática</span></div><div class="preview-controls"><button data-size="desktop" class="active" title="Escritorio">▰</button><button data-size="tablet" title="Tablet">▯</button><button data-size="mobile" title="Móvil">▯</button><button id="runPreview" title="Ejecutar">▶</button></div></div><div class="preview-stage"><iframe id="livePreview" title="Vista previa del proyecto" sandbox="allow-scripts"></iframe></div><div class="console-panel"><div class="console-head"><b>CONSOLA</b><button id="clearConsole">Limpiar</button></div><pre id="consoleOutput">La salida de JavaScript aparecerá aquí.</pre></div></section>
</main>
<div id="toast" class="editor-toast" role="status"></div>
</body></html>
