name: Publish content update manifest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/*.json'
      - 'data/**/*.json'

permissions:
  contents: write

concurrency:
  group: content-manifest-main
  cancel-in-progress: false

jobs:
  publish-manifest:
    name: Generate content checksums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate manifest
        run: node scripts/generate-content-manifest.mjs

      - name: Commit manifest when it changed
        shell: bash
        run: |
          if git diff --quiet -- updates/content-manifest.json; then
            echo "El manifiesto ya está actualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/content-manifest.json
          git commit -m "chore(content): refresh update manifest"
          git push origin HEAD:main
