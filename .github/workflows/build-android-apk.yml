name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/capacitor-android-cloud-build
      - feat/module-center-core
      - feat/downloadable-library-packs
      - feat/interactive-laboratories
    paths:
      - 'assets/**'
      - 'css/**'
      - 'data/**'
      - 'js/**'
      - 'pages/**'
      - 'projects/**'
      - 'index.html'
      - 'offline.html'
      - 'manifest.json'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - 'modules/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate update scripts and generate packaged manifest
        run: |
          node --check js/navigation.js
          node --check js/content-updates.js
          node --check js/module-manager.js
          node --check js/library-packages.js
          node --check js/lab-packages.js
          node --check js/labs.js
          node --check scripts/generate-lab-packages.mjs
          node --check scripts/validate-lab-packages.mjs
          node --check js/tools-library.js
          node --check js/search.js
          node --check js/learning-progress.js
          node --check scripts/generate-library-packages.mjs
          node --check scripts/validate-library-packages.mjs
          node --check scripts/generate-content-manifest.mjs
          node scripts/generate-library-packages.mjs
          node scripts/validate-library-packages.mjs
          node scripts/generate-lab-packages.mjs
          node scripts/validate-lab-packages.mjs
          node scripts/generate-lab-packages.mjs
          node scripts/validate-lab-packages.mjs
          node scripts/validate-module-catalog.mjs
          node scripts/generate-content-manifest.mjs

      - name: Prepare local web application
        run: npm run prepare:web

      - name: Generate Android project
        run: npx cap add android

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK signature and package metadata
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 8

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webdev-book-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
